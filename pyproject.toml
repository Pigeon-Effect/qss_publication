[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clustervalidation"
version = "2.0.0"
description = "LLM-based validation of a hierarchical topic taxonomy of AI research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "scientometrics",
    "topic modeling",
    "validation",
    "intrusion detection",
    "large language models",
    "OpenAlex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["openai>=1.30", "python-dotenv>=1.0"]
authors = [
    { name = "Julius Pfundstein", email = "julius.pfundstein@gmail.com" },
    { name = "Thomas Efer" },
    { name = "Manuel Burghardt" },
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Everything the numbered pipeline stages in code/ need. The package itself
# (src/clustervalidation, stage 07) depends only on the two libraries above.
pipeline = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pymupdf>=1.24",          # stage 01: PDF to text
    "keybert>=0.8",           # stage 01: candidate extraction
    "sentence-transformers>=2.2",  # stages 04, 06: SPECTER embeddings
    "transformers>=4.35",
    "torch>=2.0",
    "umap-learn>=0.5",        # stages 04, 06: projection
    "scikit-learn>=1.3",      # stage 04: K-Means, TF-IDF
    "nltk>=3.8",              # stage 04: lemmatisation for TF-IDF contrast
    "plotly>=5.18",           # stage 04: interactive UMAPs
]

[project.urls]
Repository = "https://github.com/Pigeon-Effect/qss_publication"

[project.scripts]
clustervalidation = "clustervalidation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
