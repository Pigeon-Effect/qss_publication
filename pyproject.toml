[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clustervalidation"
version = "1.0.0"
description = "LLM-based validation of a hierarchical topic taxonomy of AI research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "scientometrics",
    "topic modeling",
    "validation",
    "intrusion detection",
    "large language models",
    "OpenAlex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["openai>=1.30"]
authors = [
    { name = "Julius Pfundstein", email = "julius.pfundstein@gmail.com" },
    { name = "Thomas Efer" },
    { name = "Manuel Burghardt" },
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Pigeon-Effect/qss_publication"

[project.scripts]
clustervalidation = "clustervalidation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
